<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kivvi Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 80% -10%,#2b1d55,#0c0716 55%)}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1px solid rgba(160,120,255,.2);border-radius:24px;padding:28px 22px;text-align:center}
.lcard img{width:84px;height:84px;border-radius:22px}
.lcard h2{margin:14px 0 4px}
.lcard p{margin:0 0 16px;color:rgba(255,255,255,.6);font-size:14px}
input{width:100%;height:50px;border-radius:16px;border:1px solid rgba(160,120,255,.25);background:rgba(255,255,255,.06);color:#fff;padding:0 16px;font-size:15px;outline:none}
.btn{width:100%;height:50px;margin-top:12px;border:none;border-radius:16px;background:linear-gradient(100deg,#B455FF,#7A5CFF 55%,#4F8BFF);color:#fff;font-weight:700;font-size:15px}
.msg{min-height:18px;margin-top:12px;color:#F6B6E3;font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;background:linear-gradient(100deg,#D49BFF,#FF8AD0 50%,#7FB6FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-family:Nunito,Arial,sans-serif;font-size:13px;color:rgba(255,255,255,.6);-webkit-text-fill-color:initial}
.ibtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(160,120,255,.15);border-radius:20px;padding:16px}
.stat b{display:block;font-size:28px;background:linear-gradient(100deg,#D49BFF,#FF8AD0 50%,#7FB6FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:rgba(255,255,255,.6)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3DDC84;margin-right:6px}
h3{font-size:16px;margin:22px 2px 10px;color:rgba(255,255,255,.85)}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(160,120,255,.12);border-radius:20px;padding:16px}
.seg{margin-bottom:14px}
.seg .t{display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;gap:10px}
.seg small{color:rgba(255,255,255,.55)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px}
.pill{display:inline-block;margin:4px 6px 0 0;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:13px}
.empty{color:rgba(255,255,255,.5);text-align:center;margin:6px 0}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.04);border:1px solid rgba(160,120,255,.12);border-radius:18px}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7A5CFF,#B455FF);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.av i{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#3DDC84;border:2px solid #0c0716}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.info strong{font-size:15px}
.info span{font-size:12px;color:rgba(255,255,255,.6);overflow-wrap:anywhere}
.b{font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px;white-space:nowrap}
.b-loyal{background:rgba(61,220,132,.15);color:#3DDC84}
.b-in{background:rgba(255,176,32,.15);color:#FFB020}
.b-ni{background:rgba(255,91,138,.15);color:#FF5B8A}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="lcard">
    <img src="https://fyxkmzkpoykroxsjjnzm.supabase.co/storage/v1/object/public/app-assets/file_0000000084d48211843401358cb13735.png" alt="Kivvi">
    <h2>Kivvi Admin</h2>
    <p>Enter the admin code to open the dashboard</p>
    <input id="code" type="password" placeholder="Admin code" autocomplete="off">
    <button class="btn" id="go" type="button">Open dashboard</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="dash" class="wrap hidden">
  <div class="top">
    <div class="brand">Kivvi <small>Admin</small></div>
    <button class="ibtn" id="refresh" type="button">↻</button>
  </div>
  <div class="grid" id="stats"></div>

  <h3>User segments</h3>
  <div class="card" id="segments"></div>

  <h3 id="onlineTitle">Online now</h3>
  <div class="card" id="online"></div>

  <h3 id="newTitle">New signups (7 days)</h3>
  <div class="card" id="newUsers"></div>

  <h3>Feature usage (7 days)</h3>
  <div class="grid" id="usage"></div>

  <h3 id="allTitle">All users</h3>
  <input id="search" placeholder="Search name, username or email">
  <div id="list" style="margin-top:12px"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  "https://fyxkmzkpoykroxsjjnzm.supabase.co",
  "sb_publishable_djuZJaO1ZxDZOvMRW--5OQ_s_yCIOFo"
);

let CODE = "";
let data = null;
let filter = "";
let timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => ts ? new Date(ts).toLocaleString("en-US",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true}) : "never";
const ago = ts => {
  if (!ts) return "never";
  const m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " hr ago";
  return Math.floor(h / 24) + " days ago";
};
const isOnline = u => !!u.last_seen && (Date.now() - new Date(u.last_seen).getTime()) < 120000;
const daysSince = ts => ts ? (Date.now() - new Date(ts).getTime()) / 86400000 : 999;

async function fetchData() {
  const { data: res, error } = await sb.rpc("admin_dashboard", { p_code: CODE });
  if (error) return { ok: false, message: "Could not load: " + error.message };
  return res || { ok: false, message: "No data" };
}

async function login() {
  const v = $("code").value.trim();
  if (!v) return;
  CODE = v;
  const r = await fetchData();
  if (!r.ok) {
    CODE = "";
    $("loginMsg").textContent = r.message || "Wrong code";
    return;
  }
  data = r;
  $("login").classList.add("hidden");
  $("dash").classList.remove("hidden");
  render();
  clearInterval(timer);
  timer = setInterval(refresh, 30000);
}

async function refresh() {
  const r = await fetchData();
  if (r.ok) { data = r; render(); }
}

function stat(label, n, dot) {
  return '<div class="stat"><b>' + esc(n) + '</b><span>' + (dot ? '<i class="dot"></i>' : "") + esc(label) + '</span></div>';
}

function seg(label, sub, n, total, color) {
  const pct = total ? Math.round(n * 100 / total) : 0;
  return '<div class="seg"><div class="t"><span><b>' + label + '</b><br><small>' + sub + '</small></span><span>' + n + ' (' + pct + '%)</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%;background:' + color + '"></i></div></div>';
}

function badge(s) {
  if (s === "loyal") return '<span class="b b-loyal">Loyal</span>';
  if (s === "inactive") return '<span class="b b-in">Inactive</span>';
  return '<span class="b b-ni">Not interested</span>';
}

function row(u) {
  const online = isOnline(u);
  const letter = esc((u.display_name || u.username || "?").charAt(0).toUpperCase());
  return '<div class="row">' +
    '<div class="av">' + letter + (online ? '<i></i>' : '') + '</div>' +
    '<div class="info">' +
    '<strong>' + esc(u.display_name || u.username || "(no name)") + '</strong>' +
    '<span>@' + esc(u.username || "-") + ' · ' + esc(u.email || "") + '</span>' +
    '<span>Last seen: ' + (online ? "online" : ago(u.last_seen)) + ' · Last login: ' + fmt(u.last_sign_in_at) + '</span>' +
    '<span>AI msgs (7 days): ' + esc(u.ai_msgs) + ' · Room msgs (7 days): ' + esc(u.room_msgs) + ' · Joined: ' + fmt(u.created_at) + '</span>' +
    '</div>' + badge(u.segment) + '</div>';
}

function renderList() {
  const q = filter.trim().toLowerCase();
  const items = data.users.filter(u =>
    !q ||
    (u.username || "").toLowerCase().includes(q) ||
    (u.display_name || "").toLowerCase().includes(q) ||
    (u.email || "").toLowerCase().includes(q));
  $("list").innerHTML = items.map(row).join("") || '<p class="empty">No users found</p>';
  $("allTitle").textContent = "All users (" + items.length + " of " + data.users.length + ")";
}

function render() {
  const t = data.totals;
  const users = data.users || [];
  const online = users.filter(isOnline);
  const fresh = users.filter(u => daysSince(u.created_at) <= 7);

  $("stats").innerHTML =
    stat("Total users", t.total) +
    stat("Online now", t.online, true) +
    stat("New (7 days)", t.new7) +
    stat("Loyal (3 days)", t.loyal);

  $("segments").innerHTML =
    seg("Loyal", "Logged in within 3 days", t.loyal, t.total, "#3DDC84") +
    seg("Inactive", "No login for 3 to 7 days", t.inactive, t.total, "#FFB020") +
    seg("Not interested", "No login for 7+ days", t.not_interested, t.total, "#FF5B8A");

  $("onlineTitle").textContent = "Online now (" + online.length + ")";
  $("online").innerHTML = online.length
    ? online.map(u => '<span class="pill">@' + esc(u.username) + '</span>').join("")
    : '<p class="empty">Nobody is online right now</p>';

  $("newTitle").textContent = "New signups in 7 days (" + fresh.length + ")";
  $("newUsers").innerHTML = fresh.length
    ? fresh.map(u => '<span class="pill">@' + esc(u.username) + ' · ' + esc(fmt(u.created_at)) + '</span>').join("")
    : '<p class="empty">No new signups</p>';

  $("usage").innerHTML =
    stat("AI chat users", t.ai_users7) +
    stat("Room chat users", t.chat_users7) +
    stat("Used both", t.both7);

  renderList();
}

$("go").addEventListener("click", login);
$("code").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("refresh").addEventListener("click", refresh);
$("search").addEventListener("input", e => { filter = e.target.value; renderList(); });
</script>
</body>
</html>
